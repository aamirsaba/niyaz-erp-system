<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Setup - Niyaz ERP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <img src="niyaz_logo.png" alt="Niyaz">
                <span>Niyaz Group ERP</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">📊 Dashboard</a>
                <a href="company.html">🏢 Company Setup</a>
                <a href="users.html">👤 User Management</a>
                <a href="hr.html">👥 HR & Payroll</a>
                <a href="accounting.html">💰 Accounting & VAT</a>
                <a href="projects.html">📋 Project Management</a>
                <a href="crm.html">🤝 CRM</a>
                <a href="alerts.html">🔔 Alerts</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <div class="company-selector">
                    <label>🏢 Select Company:</label>
                    <select id="companySelect"></select>
                </div>
                <div class="user-info">👋 Welcome, Admin</div>
            </header>

            <h1>🏢 Company Setup</h1>
            
            <div class="form-card">
                <h3>➕ Add New Company</h3>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="companyName" placeholder="e.g., Niyaz International LLC">
                </div>
                <div class="form-group">
                    <label>VAT Registration Number</label>
                    <input type="text" id="vatNumber" placeholder="e.g., OM1234567">
                </div>
                <div class="form-group">
                    <label>Tax Identification Number</label>
                    <input type="text" id="tinNumber" placeholder="e.g., 123456789">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="Muscat, Oman">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" placeholder="+968 XXXX XXXX">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="info@niyaz.com">
                </div>
                <button onclick="addCompany()">➕ Create Company</button>
            </div>

            <div class="table-container">
                <h3>📋 Group Companies</h3>
                <table id="companiesTable">
                    <thead>
                        <tr><th>ID</th><th>Company Name</th><th>VAT Number</th><th>TIN</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody id="companiesList"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let companies = [
            { id: 1, name: 'Niyaz International LLC', vat: 'OM1234567', tin: '123456789', address: 'Muscat', phone: '+968 91234567', email: 'info@niyaz.com', status: 'Active' },
            { id: 2, name: 'Niyaz Facilities Management', vat: 'OM2345678', tin: '234567890', address: 'Seeb', phone: '+968 92345678', email: 'fm@niyaz.com', status: 'Active' },
            { id: 3, name: 'Niyaz Technical Services', vat: 'OM3456789', tin: '345678901', address: 'Al Khuwair', phone: '+968 93456789', email: 'tech@niyaz.com', status: 'Active' }
        ];

        function loadCompanies() {
            const tbody = document.getElementById('companiesList');
            tbody.innerHTML = companies.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td><strong>${c.name}</strong></td>
                    <td>${c.vat}</td>
                    <td>${c.tin}</td>
                    <td><span class="badge badge-active">${c.status}</span></td>
                    <td><button onclick="deleteCompany(${c.id})" style="background:#dc3545; padding:5px 10px;">Delete</button></td>
                </tr>
            `).join('');
            
            const select = document.getElementById('companySelect');
            if(select) {
                select.innerHTML = companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            }
        }

        function addCompany() {
            const name = document.getElementById('companyName').value;
            const vat = document.getElementById('vatNumber').value;
            const tin = document.getElementById('tinNumber').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            
            if(!name) { alert('Enter company name'); return; }
            
            const newId = companies.length + 1;
            companies.push({ id: newId, name, vat, tin, address, phone, email, status: 'Active' });
            loadCompanies();
            
            document.getElementById('companyName').value = '';
            document.getElementById('vatNumber').value = '';
            document.getElementById('tinNumber').value = '';
            document.getElementById('address').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('email').value = '';
            
            alert(`✅ ${name} added successfully!`);
        }

        function deleteCompany(id) {
            if(confirm('Delete this company?')) {
                companies = companies.filter(c => c.id !== id);
                loadCompanies();
            }
        }

        loadCompanies();
    </script>
</body>
</html>
